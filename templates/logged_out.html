<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logged Out</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f7f2ed;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Poppins,sans-serif;
}

.card{
    width:420px;
    border:none;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
    padding:35px;
    text-align:center;
}

h2{
    color:#9b6b43;
    margin-bottom:15px;
}

p{
    color:#555;
    margin-bottom:25px;
}

.btn-home{
    background:#9b6b43;
    color:white;
    padding:12px 30px;
    border-radius:10px;
    text-decoration:none;
}

.btn-home:hover{
    background:#7d5433;
    color:white;
}
</style>
</head>

<body>

<div class="card">

<h2>You have been logged out!</h2>

<p>Your session has ended successfully.</p>

<a href="/" class="btn-home">Login Again</a>

</div>

</body>
</html>
