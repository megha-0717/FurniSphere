<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    margin:0;
    padding:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
    url("https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=1600");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.login-container,
.signup-container{
    width:400px;
    background:rgba(255,255,255,.95);
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    backdrop-filter:blur(8px);
}

.login-container h2,
.signup-container h2{
    color:#8B5E3C;
    font-weight:700;
    text-align:center;
    margin-bottom:25px;
}

.form-control{
    border:1px solid #d6b08a;
    border-radius:10px;
    padding:10px 15px;
}

.form-control:focus{
    border-color:#8B5E3C;
    box-shadow:0 0 0 .2rem rgba(139,94,60,.2);
}

.btn-primary{
    width:100%;
    background:#8B5E3C;
    border:none;
    border-radius:10px;
    font-weight:600;
    padding:10px;
    transition:.3s;
}

.btn-primary:hover{
    background:#6f472b;
}

a{
    color:#8B5E3C;
    font-weight:600;
    text-decoration:none;
}

a:hover{
    color:#6f472b;
    text-decoration:underline;
}

.text-center{
    margin-top:15px;
} 
</style>
</head>
<body>

<div class="signup-container">
    <h2 class="mb-4">Create Account</h2>

    <form action="{{ url_for('sucess') }}" method="POST">
    <input type="hidden" name="next" value="{{ request.args.get('next','/') }}">
        <div class="mb-3">
            <input type="text" name="nm" class="form-control"
        placeholder="Full Name" required>
        </div>

        <div class="mb-3">
            <input type="email" name="em" class="form-control"
            placeholder="Email Address" required>
        </div>

        <div class="mb-3">
            <input type="text" name="num" class="form-control"
            placeholder="Phone Number" required>
        </div>

        <div class="mb-3">
            <input type="password" name="pswd" class="form-control"
            placeholder="Password" required>
        </div>
     
        <button type="submit" class="btn btn-primary w-100">  
            Sign Up
        </button>
    </form>

    <p class="text-center mt-3">
        Already have an account?
        <a href="/login">Login</a>
    </p>
</div>

</body>
</html>
